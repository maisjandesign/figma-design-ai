<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">FIGMA DESIGN AI local architecture</title>
  <desc id="desc">Figma connects over a loopback WebSocket to one shared bridge, which serves multiple Codex chats through MCP.</desc>
  <defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#faf9ff"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#8b5cf6"/></marker><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".08"/></filter></defs>
  <rect width="1200" height="420" rx="28" fill="#f7f5ff"/><g filter="url(#s)"><rect x="58" y="105" width="260" height="210" rx="20" fill="url(#panel)" stroke="#e2ddf5"/><rect x="470" y="72" width="260" height="276" rx="20" fill="url(#panel)" stroke="#cfc4f7"/><rect x="882" y="58" width="260" height="130" rx="20" fill="url(#panel)" stroke="#e2ddf5"/><rect x="882" y="232" width="260" height="130" rx="20" fill="url(#panel)" stroke="#e2ddf5"/></g>
  <rect x="84" y="132" width="42" height="42" rx="12" fill="#1f1f23"/><circle cx="98" cy="146" r="7" fill="#f24e1e"/><circle cx="112" cy="146" r="7" fill="#ff7262"/><circle cx="98" cy="160" r="7" fill="#a259ff"/><circle cx="112" cy="160" r="7" fill="#1abcfe"/><text x="140" y="151" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#202124">Figma desktop</text><text x="84" y="205" font-family="Arial,sans-serif" font-size="14" font-weight="650" fill="#202124">FIGMA DESIGN AI</text><text x="84" y="231" font-family="Arial,sans-serif" font-size="12" fill="#6f7178">Reads the active selection</text><text x="84" y="252" font-family="Arial,sans-serif" font-size="12" fill="#6f7178">Reviews every document write</text><text x="84" y="282" font-family="Arial,sans-serif" font-size="11" font-weight="650" fill="#16845b">LOCAL CLIENT</text>
  <rect x="505" y="108" width="50" height="50" rx="15" fill="#7c3aed"/><path d="m520 143 20-20m-23 23-3 3a7 7 0 0 1-10-10l6-6a7 7 0 0 1 10 0m23-13 3-3a7 7 0 0 1 10 10l-6 6a7 7 0 0 1-10 0" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><text x="570" y="130" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#202124">Shared local bridge</text><text x="505" y="195" font-family="Arial,sans-serif" font-size="12" fill="#6f7178">One owner process keeps the</text><text x="505" y="216" font-family="Arial,sans-serif" font-size="12" fill="#6f7178">active Figma connection.</text><text x="505" y="250" font-family="Arial,sans-serif" font-size="12" fill="#6f7178">Additional chats become proxies</text><text x="505" y="271" font-family="Arial,sans-serif" font-size="12" fill="#6f7178">instead of choosing new ports.</text><rect x="505" y="298" width="188" height="30" rx="15" fill="#eee9ff"/><text x="530" y="318" font-family="Arial,sans-serif" font-size="11" font-weight="650" fill="#6d28d9">127.0.0.1 · offline capable</text>
  <rect x="908" y="85" width="36" height="36" rx="11" fill="#1f1f23"/><text x="956" y="105" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#202124">Codex chat A</text><text x="908" y="151" font-family="Arial,sans-serif" font-size="12" fill="#6f7178">MCP tools over stdio</text><rect x="908" y="259" width="36" height="36" rx="11" fill="#1f1f23"/><text x="956" y="279" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#202124">Codex chat B</text><text x="908" y="325" font-family="Arial,sans-serif" font-size="12" fill="#6f7178">Automatic shared proxy</text>
  <path d="M318 210h140" fill="none" stroke="#8b5cf6" stroke-width="3" marker-end="url(#arrow)"/><text x="342" y="194" font-family="Arial,sans-serif" font-size="11" fill="#6d28d9">WebSocket</text><path d="M730 150h140" fill="none" stroke="#8b5cf6" stroke-width="3" marker-end="url(#arrow)"/><path d="M730 268h140" fill="none" stroke="#8b5cf6" stroke-width="3" marker-end="url(#arrow)"/><text x="775" y="135" font-family="Arial,sans-serif" font-size="11" fill="#6d28d9">MCP</text><text x="775" y="252" font-family="Arial,sans-serif" font-size="11" fill="#6d28d9">MCP</text>
</svg>
